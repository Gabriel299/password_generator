<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <link href="output.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body class="bg-bg text-title">

  <h1 class="text-h1 text-center mt-2">Password Generator</h1>

  <article class="bg-[#101f0c8c] backdrop-blur-sm border border-[#f4c43052] w-[40%] mx-auto rounded-xl my-6  p-8">

    <h2 class="text-text text-h2">Crea la tua password istantaneamente</h2>

    <section class="flex justify-between bg-[#203A27] my-6 p-6 rounded-lg">
      <p class="text-text text-paragraph" id="password"></p>

      <button type="button" class="cursor-pointer" id="copied">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20" class="hidden"><!-- !Font Awesome Free
          v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026
          Fonticons, Inc. -->
          <path fill="#0dff00"
            d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z" />
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20"><!-- !Font Awesome Free
          v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026
          Fonticons, Inc. -->
          <path fill="#d0eaca"
            d="M352 528L128 528C119.2 528 112 520.8 112 512L112 288C112 279.2 119.2 272 128 272L176 272L176 224L128 224C92.7 224 64 252.7 64 288L64 512C64 547.3 92.7 576 128 576L352 576C387.3 576 416 547.3 416 512L416 464L368 464L368 512C368 520.8 360.8 528 352 528zM288 368C279.2 368 272 360.8 272 352L272 128C272 119.2 279.2 112 288 112L512 112C520.8 112 528 119.2 528 128L528 352C528 360.8 520.8 368 512 368L288 368zM224 352C224 387.3 252.7 416 288 416L512 416C547.3 416 576 387.3 576 352L576 128C576 92.7 547.3 64 512 64L288 64C252.7 64 224 92.7 224 128L224 352z" />
        </svg>
      </button>
    </section>

    <section class="grid grid-cols-8 items-center gap-2 mb-6 mr-10" id="security">
      <p class="text-text text-[1rem] col-span-2">SICUREZZA</p>
      <div class="border border-red-500 h-3 rounded-full"></div>
      <div class="border border-red-500 h-3 rounded-full"></div>
      <div class="border border-title h-3 rounded-full"></div>
      <div class="border border-title h-3 rounded-full"></div>
      <div class="border border-green-500 h-3 rounded-full"></div>
      <div class="border border-green-500 h-3 rounded-full"></div>
    </section>

    <!-- FORM -->
    <section class="flex justify-between mb-1">
      <label for="length" class="text-text tracking-[0.04375rem]">LUNGHEZZA</label>
      <span class="text-text" id="lengthN"></span>
    </section>
    <input class="w-full my-6" type="range" id="length" min="8" max="30" value="16">

    <!-- CHECKBOX -->
    <section class="grid grid-cols-2 grid-rows-2 gap-4">
      <div class="flex items-center gap-1">
        <input type="checkbox" id="maiusc" checked class="w-5.5 h-5.5" onclick="generatePassword()">
        <label for="maiusc" class="text-text text-checkbox ml-3">Lettere maiuscole</label>
      </div>
      <div class="flex items-center gap-1">
        <input type="checkbox" id="minusc" checked class="w-5.5 h-5.5" onclick="generatePassword()">
        <label for="minusc" class="text-text text-checkbox ml-3">Lettere minuscole</label>
      </div>
      <div class="flex items-center gap-1">
        <input type="checkbox" id="numbers" checked class="w-5.5 h-5.5" onclick="generatePassword()">
        <label for="numbers" class="text-text text-checkbox ml-3">Numeri</label>
      </div>
      <div class="flex items-center gap-1">
        <input type="checkbox" id="symbols" checked class="w-5.5 h-5.5" onclick="generatePassword()">
        <label for="symbols" class="text-text text-checkbox ml-3">Simboli</label>
      </div>
    </section>

    <button 
      type="button"
      id="generatePassword"
      class="bg-title text-[#3E2E00] flex justify-center items-center gap-4 w-full mt-6 py-4 tracking-[0.0875rem] cursor-pointer rounded-lg">
      GENERA PASSSWORD
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20"><!-- !Font Awesome Free v7.3.1
        by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026
        Fonticons, Inc. -->
        <path fill="#3e2e00"
          d="M129.9 292.5C143.2 199.5 223.3 128 320 128C373 128 421 149.5 455.8 184.2C456 184.4 456.2 184.6 456.4 184.8L464 192L416.1 192C398.4 192 384.1 206.3 384.1 224C384.1 241.7 398.4 256 416.1 256L544.1 256C561.8 256 576.1 241.7 576.1 224L576.1 96C576.1 78.3 561.8 64 544.1 64C526.4 64 512.1 78.3 512.1 96L512.1 149.4L500.8 138.7C454.5 92.6 390.5 64 320 64C191 64 84.3 159.4 66.6 283.5C64.1 301 76.2 317.2 93.7 319.7C111.2 322.2 127.4 310 129.9 292.6zM573.4 356.5C575.9 339 563.7 322.8 546.3 320.3C528.9 317.8 512.6 330 510.1 347.4C496.8 440.4 416.7 511.9 320 511.9C267 511.9 219 490.4 184.2 455.7C184 455.5 183.8 455.3 183.6 455.1L176 447.9L223.9 447.9C241.6 447.9 255.9 433.6 255.9 415.9C255.9 398.2 241.6 383.9 223.9 383.9L96 384C87.5 384 79.3 387.4 73.3 393.5C67.3 399.6 63.9 407.7 64 416.3L65 543.3C65.1 561 79.6 575.2 97.3 575C115 574.8 129.2 560.4 129 542.7L128.6 491.2L139.3 501.3C185.6 547.4 249.5 576 320 576C449 576 555.7 480.6 573.4 356.5z" />
      </svg>
    </button>

  </article>

</body>

</html>
